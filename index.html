<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Teacher 2026</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      max-width: 640px;
      background: var(--card-bg);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
      color: var(--text-main);
    }
    p {
      line-height: 1.6;
      color: var(--text-muted);
      font-size: 1.05rem;
    }
    .cta-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
      transition: opacity 0.2s;
    }
    .cta-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Teacher 2026</h1>
    <p>Welcome. We provide structured curriculum, insights, and practical education at the intersection of modern artificial intelligence and real-world applications.</p>
    <p>Our platform and resources are currently being updated for 2026.</p>
    <a href="mailto:contact@aiteacher2026.com" class="cta-btn">Contact Us</a>
  </div>
</body>
</html>

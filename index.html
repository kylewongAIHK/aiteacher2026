<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Teacher 2026</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 16px 0;
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
    }
    p {
      margin: 0 0 16px 0;
      line-height: 1.6;
      color: var(--text-muted);
      font-size: 1rem;
    }
    .cta-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 22px;
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
      transition: opacity 0.2s ease;
    }
    .cta-btn:hover {
      opacity: 0.9;
    }
    .footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.85rem;
    }
    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .footer a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Teacher 2026</h1>
    <p>Welcome. We provide structured curriculum, insights, and practical education at the intersection of modern artificial intelligence and real-world applications.</p>
    <p>Our platform and resources are currently being updated for 2026.</p>
    <a href="mailto:contact@aiteacher2026.com" class="cta-btn">Contact Us</a>

    <div class="footer">
      <a href="/privacy.html">Privacy Policy</a>
    </div>
  </div>
</body>
</html>
